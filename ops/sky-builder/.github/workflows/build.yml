name: sky-remote-build
run-name: sky-build:${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      request_key:
        required: true
        type: string
      request_digest:
        required: true
        type: string
permissions: {}
concurrency:
  group: sky-build-${{ inputs.build_id }}
  cancel-in-progress: false
env:
  BUILD_ID: ${{ inputs.build_id }}
  REQUEST_KEY: ${{ inputs.request_key }}
  REQUEST_DIGEST: ${{ inputs.request_digest }}
  SKY_PLATFORM_CODE_SHA: ${{ vars.SKY_PLATFORM_CODE_SHA }}
  SKY_ARTIFACTS_BUCKET: ${{ vars.SKY_ARTIFACTS_BUCKET }}
  SKY_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check immutable platform code pin
        run: '[[ "$SKY_PLATFORM_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SoftBank-Hydrogen/sky-platform
          ref: ${{ vars.SKY_PLATFORM_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -e '.[state-postgres]'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_APP_BUILDER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python scripts/remote_builder.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sky-build-input
          path: build-input/
          retention-days: 1
  build:
    needs: prepare
    env:
      SKY_REQUIRE_ISOLATED_BUILDS: "true"
      SKY_OFFLINE_BUILD_BASES_JSON: ${{ vars.SKY_OFFLINE_BUILD_BASES_JSON }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SoftBank-Hydrogen/sky-platform
          ref: ${{ vars.SKY_PLATFORM_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -e '.[state-postgres]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sky-build-input
          path: build-input/
      - name: Build without AWS credentials or OIDC permission
        run: python scripts/remote_builder.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sky-build-image
          path: build-output/image.tar
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SoftBank-Hydrogen/sky-platform
          ref: ${{ vars.SKY_PLATFORM_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -e '.[state-postgres]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sky-build-input
          path: build-input/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sky-build-image
          path: build-output/
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_APP_BUILDER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python scripts/remote_builder.py publish
