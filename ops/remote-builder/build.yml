# Reference for a separate PERSONAL sky-builder repository; not active here.
# Copy to .github/workflows/build.yml and pin that commit in Sky/infra.
# Required repository variables: SKY_PLATFORM_CODE_SHA (full commit),
# SKY_ARTIFACTS_BUCKET, AWS_ACCOUNT_ID, AWS_REGION, AWS_APP_BUILDER_ROLE_ARN.
# The IAM trust and GitHub App installation must target that personal builder.
name: sky-remote-build
run-name: sky-build:${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      request_key:
        required: true
        type: string
      request_digest:
        required: true
        type: string
permissions: {}
concurrency:
  group: sky-build-${{ inputs.build_id }}
  cancel-in-progress: false
env:
  BUILD_ID: ${{ inputs.build_id }}
  REQUEST_KEY: ${{ inputs.request_key }}
  REQUEST_DIGEST: ${{ inputs.request_digest }}
  SKY_PLATFORM_CODE_SHA: ${{ vars.SKY_PLATFORM_CODE_SHA }}
  SKY_ARTIFACTS_BUCKET: ${{ vars.SKY_ARTIFACTS_BUCKET }}
  SKY_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_EC2_METADATA_DISABLED: "true"
  SKY_BUILD_ATTESTATIONS_ENABLED: ${{ vars.SKY_BUILD_ATTESTATIONS_ENABLED }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check immutable platform code pin
        run: '[[ "$SKY_PLATFORM_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: sangmu1126/sky-platform
          ref: ${{ vars.SKY_PLATFORM_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[aws-native]'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_BUILDER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: python scripts/remote_builder.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: sky-build-input
          path: build-input/
          if-no-files-found: error
          retention-days: 1
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check immutable platform code pin
        run: '[[ "$SKY_PLATFORM_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: sangmu1126/sky-platform
          ref: ${{ vars.SKY_PLATFORM_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[aws-native]'
      - uses: actions/download-artifact@v4
        with:
          name: sky-build-input
          path: build-input/
      - name: Build without AWS credentials or OIDC permission
        run: python scripts/remote_builder.py build
      - uses: actions/upload-artifact@v4
        with:
          name: sky-build-image
          path: |
            build-output/image.tar
            build-output/build.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check immutable platform code pin
        run: '[[ "$SKY_PLATFORM_CODE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: sangmu1126/sky-platform
          ref: ${{ vars.SKY_PLATFORM_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[aws-native]'
      - uses: actions/download-artifact@v4
        with:
          name: sky-build-input
          path: build-input/
      - uses: actions/download-artifact@v4
        with:
          name: sky-build-image
          path: build-output/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_BUILDER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Publish checked image and optionally export signing inputs
        run: |
          if [ "$SKY_BUILD_ATTESTATIONS_ENABLED" = "true" ]; then
            python scripts/remote_builder.py publish --attestation-output published-proof
          else
            python scripts/remote_builder.py publish
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: vars.SKY_BUILD_ATTESTATIONS_ENABLED == 'true'
        with:
          name: sky-build-published
          path: published-proof/
          if-no-files-found: error
          retention-days: 1

  attest:
    if: vars.SKY_BUILD_ATTESTATIONS_ENABLED == 'true'
    needs: publish
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: sangmu1126/sky-platform/.github/workflows/attest-build.yml@c6b584db36e99dcdf93b7f9766f55611f771fe15
    with:
      build_id: ${{ inputs.build_id }}
      request_digest: ${{ inputs.request_digest }}
