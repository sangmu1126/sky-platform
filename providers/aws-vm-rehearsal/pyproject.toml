[project]
name = "sky-aws-vm-rehearsal-provider"
version = "0.1.0"
description = "Pinned, non-activated AWS-to-VM Sky environment provider rehearsal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sky-platform==0.1.0", "boto3>=1.40,<2", "psycopg[binary]>=3.2,<4"]

[project.entry-points."sky.environment_execution.v1"]
sky-aws-vm-rehearsal = "sky_aws_vm_rehearsal.provider:provide"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sky_aws_vm_rehearsal = ["ca.pem"]
