name: dependency-security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -e '.[aws-native,state-postgres,security-audit]'
      - name: Audit trusted service Python dependencies
        run: python scripts/audit_python_dependencies.py --output python-dependency-audit.json --sbom-output python-sbom.cdx.json
      - name: Validate SBOM against pinned official CycloneDX schema
        run: python scripts/validate_sbom.py --input python-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-dependency-audit
          path: |
            python-dependency-audit.json
            python-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
  guest-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check trusted sealed-guest stdlib helpers on distro runtime
        run: python scripts/check_guest_runtime.py
  controller-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify hashed controller dependency set in a fresh Linux environment
        run: |
          python -m venv "$RUNNER_TEMP/sky-controller-check"
          "$RUNNER_TEMP/sky-controller-check/bin/python" -m pip install --only-binary=:all: --require-hashes -r requirements/builder-linux-cp312.lock
          "$RUNNER_TEMP/sky-controller-check/bin/python" -m pip install --no-build-isolation --no-deps -e .
          "$RUNNER_TEMP/sky-controller-check/bin/python" -m pip check
          "$RUNNER_TEMP/sky-controller-check/bin/python" -c 'import boto3, cryptography, jwt, jsonschema'
