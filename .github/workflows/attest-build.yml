name: sky-trusted-build-attestation
on:
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
      request_digest:
        required: true
        type: string
permissions: {}
jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      BUILD_ID: ${{ inputs.build_id }}
      REQUEST_DIGEST: ${{ inputs.request_digest }}
      SKY_PLATFORM_CODE_SHA: 26bb4760deffe59e8bf1367ab8655def2bc18525
      PYTHONPATH: src
      AWS_EC2_METADATA_DISABLED: "true"
      CALLER_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Check supported personal repository visibility before signing
        run: |
          if [ "$CALLER_REPOSITORY_PRIVATE" != "false" ]; then
            echo "::error::This personal GitHub attestation backend requires a public caller repository. Keep private repositories private and configure an approved alternative backend."
            exit 1
          fi
      # This reusable workflow reviews data only. No user checkout, pip install,
      # AWS login, Docker invocation or execution of uploaded code in the signing job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sangmu1126/sky-platform
          ref: 26bb4760deffe59e8bf1367ab8655def2bc18525
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sky-build-input
          path: build-input/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sky-build-published
          path: published-proof/
      - name: Check caller, ZIP, request and image identities without source execution
        run: python -m scripts.build_attestation
      - name: Sign both the exact manifest and minimal input binding record
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            signing-output/manifest.json
            signing-output/statement.json
      - name: Retain the verification bundle with its subjects
        env:
          SIGNED_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python - <<'PY'
          import os, shutil
          shutil.copyfile(os.environ['SIGNED_BUNDLE'], 'signing-output/bundle.json')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sky-build-attestations
          path: signing-output/
          if-no-files-found: error
          retention-days: 7
