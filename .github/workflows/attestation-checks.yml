name: synthetic-attestation-checks
on:
  workflow_dispatch:
permissions: {}
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SKY_PLATFORM_CODE_SHA: 26bb4760deffe59e8bf1367ab8655def2bc18525
      PYTHONPATH: src
      AWS_EC2_METADATA_DISABLED: "true"
    outputs:
      build_id: ${{ steps.fixture.outputs.build_id }}
      request_digest: ${{ steps.fixture.outputs.request_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sangmu1126/sky-platform
          ref: 26bb4760deffe59e8bf1367ab8655def2bc18525
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate synthetic bytes only, without AWS or Docker
        id: fixture
        run: python -m scripts.check_build_attestation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sky-build-input
          path: fixture/build-input/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sky-build-published
          path: fixture/published-proof/
          if-no-files-found: error
          retention-days: 1
  attest:
    needs: fixture
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: sangmu1126/sky-platform/.github/workflows/attest-build.yml@e1b3c37483e9eb8035089d1452eb6c1bc07d9b2d
    with:
      build_id: ${{ needs.fixture.outputs.build_id }}
      request_digest: ${{ needs.fixture.outputs.request_digest }}
