name: builder-checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -e '.[dev,aws-native]'
      - name: Prepare fixture base image
        run: docker pull --platform linux/amd64 node:22-bookworm-slim
      - name: Verify remote build boundaries and actual image round trip
        run: pytest -q -rs tests/unit/test_remote_build.py tests/unit/test_remote_build_publish.py tests/unit/test_builder_connection.py tests/unit/test_image_manifests.py
        env:
          SKY_TEST_BUILD_EXPORT_DIR: ${{ runner.temp }}/sky-builder-handoff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: builder-handoff
          path: ${{ runner.temp }}/sky-builder-handoff/
          if-no-files-found: error
          retention-days: 1

  handoff:
    needs: builder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -e '.[aws-native]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: builder-handoff
          path: ${{ runner.temp }}/sky-builder-handoff/
      - name: Prepare loopback-only fixture registry
        run: docker pull registry:2.8.3
      - name: Verify and execute the transferred synthetic image
        run: python -m scripts.check_builder_handoff
        env:
          SKY_TEST_BUILD_EXPORT_DIR: ${{ runner.temp }}/sky-builder-handoff
