<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky · 배포 운영</title>
<style>body{margin:0;background:#f5f6f8;color:#202733;font:15px system-ui,sans-serif}main{max-width:900px;margin:24px auto;padding:28px;background:white;border-radius:20px}h1{font-size:26px}p{line-height:1.6}input{padding:10px;border:1px solid #ddd;border-radius:8px}button{margin:8px 8px 8px 0;padding:11px 16px;border:0;border-radius:9px;background:#3182f6;color:white;font:inherit}button:disabled{background:#a8b5c5}section{padding:18px;margin:16px 0;background:#f5f6f8;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}label{display:block;margin:12px 0}.muted{color:#536071}</style></head><body><main>
<h1>배포 이후 운영</h1><p class="muted">관측 → 검토·승인 → 대상 준비 → 데이터 이전·전환 → 효과 확인. 각 단계는 현재 작업의 기록과 등록된 실행 기능을 기준으로 표시합니다.</p>
<form id="form"><label>배포 작업 <input id="job" pattern="[a-f0-9]{16}" minlength="16" maxlength="16" required autocomplete="off"></label><button id="load">상태 조회</button></form>
<p id="message" role="status" aria-live="polite"></p><section><h2 id="phase">작업을 선택하세요</h2><pre id="summary"></pre><pre id="operations"></pre></section>
<section><h2>운영 검토와 실행</h2><pre id="proposal"></pre><button id="review" disabled>관측 결과로 검토 갱신</button><button id="approve" disabled>현재 제안 승인</button>
<label><input id="consent" type="checkbox">표시된 제안·비용과 실행 범위를 확인했습니다.</label><button id="prepare" disabled>전용 DB 준비</button><button id="cutover" disabled>데이터 이전·Blue → Green 전환</button></section>
<section><h2>전환 효과</h2><pre id="effect">측정 결과 없음</pre><button id="effectReview" disabled>현재 배포의 효과 검토</button></section>
<section><h2>중단된 작업 확인</h2><pre id="recovery">자동 재실행하지 않습니다. 기존 작업 결과부터 확인합니다.</pre><label><input id="recoveryConsent" type="checkbox">기존 실행기 배제와 대상 확인을 거친 동일 작업 재개를 요청합니다.</label><button id="resume" disabled>확인 후 준비 작업 재개</button></section>
</main><script>
const el=id=>document.getElementById(id),jobPattern=/^[a-f0-9]{16}$/;
const state={epoch:0,job:null,value:null,busy:false,timer:null,request:null};
const phaseNames={observing:'운영 관측 중',approval_required:'운영 제안 승인 필요',approved:'운영 제안 승인됨',executing:'작업 실행 중',needs_attention:'기존 결과 확인 필요',effect_review_required:'전환 완료 · 효과 검토 필요',observed:'전환 후 효과 확인',security_hold:'보안 사유로 변경 중지'};
function base(){return '/api/jobs/'+state.job}
async function api(path,body){const options={credentials:'same-origin',cache:'no-store',redirect:'error'};if(body!==undefined){options.method='POST';options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(body)}const response=await (window.skyAuth?window.skyAuth.fetch(path,options):fetch(path,options));const value=await response.json();if(!response.ok)throw Error(value.error||'요청을 처리할 수 없습니다.');return value}
function key(action){return 'sky.operating.v1.'+state.job+'.'+action}
function pending(action){const raw=sessionStorage.getItem(key(action));if(!raw)return null;const v=JSON.parse(raw);if(!v||v.job_id!==state.job||!['prepare','cutover'].includes(v.action)||v.action!==action||typeof v.proposal_id!=='string'||!/^OPR-[a-f0-9]{24}$/.test(v.proposal_id)||typeof v.request_key!=='string'||! /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(v.request_key)||Object.keys(v).length!==4)throw Error('저장된 요청을 운영자가 확인해야 합니다.');return v}
function render(){const v=state.value;if(!v){for(const id of ['review','approve','prepare','cutover','effectReview','resume'])el(id).disabled=true;return;}el('phase').textContent=phaseNames[v.phase]||'상태 확인 필요';el('summary').textContent='앱: '+v.application_id+'\nDB 역할: '+(v.database_role||'없음')+'\n기록 revision: '+v.revision;el('operations').textContent=v.operations.map(o=>o.kind+' · '+o.status+(o.stage?' · '+o.stage:'')+'\n작업 '+o.id+(o.requires_attention?'\n결과가 불확실합니다. 새 실행을 보내지 않습니다.':'')).join('\n\n')+(v.has_more_operations?'\n이전 작업 이력이 더 있습니다.':'');const c=v.capabilities,blocked=state.busy||v.operations.some(o=>['queued','running','needs_attention'].includes(o.status));el('review').disabled=blocked||!c.review;el('approve').disabled=blocked||!c.review||v.proposal_status!=='pending_approval';el('prepare').disabled=blocked||!c.prepare||v.proposal_status!=='approved'||!el('consent').checked;el('cutover').disabled=blocked||!c.cutover||!el('consent').checked;el('effectReview').disabled=state.busy||!c.effect_review;const op=v.operations.find(o=>o.recovery_enabled);el('resume').disabled=state.busy||!op||!el('recoveryConsent').checked;el('recovery').textContent=v.operations.some(o=>o.requires_attention)?(op?'등록된 복구 실행기가 이전 실행 중지·현재 권한·실제 대상·원래 작업 버전을 다시 확인한 뒤 같은 작업을 큐에 넣습니다.':'등록된 웹 복구 실행기가 없습니다. 작업 ID를 운영자에게 전달해 원래 실행기와 리소스를 확인해야 합니다.'): '확인이 필요한 중단 작업이 없습니다.';el('effect').textContent=JSON.stringify({effect:v.effect||'미검증',performance:v.performance||'부하 비교 미측정'},null,2);el('load').disabled=state.busy}
async function load(){const job=el('job').value.trim();if(!jobPattern.test(job))return;clearTimeout(state.timer);const epoch=++state.epoch;state.job=job;state.value=null;state.busy=true;el('consent').checked=false;el('recoveryConsent').checked=false;render();el('message').textContent='현재 기록 조회 중';try{const v=await api(base()+'/operating-lifecycle');if(epoch!==state.epoch)return;if(v.job_id!==job||!Array.isArray(v.operations))throw Error('작업 응답 범위가 다릅니다.');state.value=v;el('message').textContent='기존 기록을 조회했습니다. 조회 자체는 배포나 복구를 실행하지 않습니다.';if(v.capabilities.review){const review=await api(base()+'/operating-review');if(epoch!==state.epoch)return;el('proposal').textContent=JSON.stringify(review.proposal||'관측·정책 조건을 만족하는 제안 없음',null,2)}else el('proposal').textContent='현재 배포에 등록된 운영 정책이 없습니다.';for(const action of ['prepare','cutover']){const saved=pending(action);if(saved)el('message').textContent='이전에 보낸 '+action+' 요청이 있습니다. 같은 요청 키로만 확인합니다.'}if(v.operations.some(o=>['running','queued'].includes(o.status)))state.timer=setTimeout(load,3000)}catch(e){el('message').textContent=e.message}finally{if(epoch===state.epoch){state.busy=false;render()}}}
async function act(action){if(state.busy||!state.value)return;const epoch=state.epoch,job=state.job,v=state.value;state.busy=true;render();try{let path,body;if(['prepare','cutover'].includes(action)){const saved=pending(action);if(saved&&saved.proposal_id!==v.proposal_id)throw Error('이전 제안의 접수 결과부터 확인해야 합니다.');const request=saved||{job_id:job,action,proposal_id:v.proposal_id,request_key:crypto.randomUUID()};if(!saved)sessionStorage.setItem(key(action),JSON.stringify(request));path=base()+'/database-'+(action==='prepare'?'preparation':'cutover');body={proposal_id:request.proposal_id,request_key:request.request_key,[action==='prepare'?'confirm_preparation':'confirm_cutover']:true}}else if(action==='effectReview'){const op=v.operations.find(o=>o.kind==='db_dedicated_cutover'&&o.status==='succeeded');if(!op)throw Error('완료된 전환 작업이 없습니다.');path=base()+'/operating-lifecycle/effect-review';body={operation_id:op.id,confirm_review:true}}else if(action==='resume'){const op=v.operations.find(o=>o.recovery_enabled);if(!op)throw Error('등록된 복구 경로가 없습니다.');path=base()+'/operations/'+op.id+'/resume-preparation';body={attempt_id:op.attempt_id,row_version:op.row_version,confirm_reconciliation:true}}else{path=base()+'/operating-review/'+action;body=action==='approve'?{proposal_id:v.proposal_id,confirm_review:true}:{}}await api(path,body);if(epoch!==state.epoch)return;el('consent').checked=false;el('recoveryConsent').checked=false;state.busy=false;await load()}catch(e){if(epoch===state.epoch)el('message').textContent=e.message+' 자동 재전송하지 않습니다. 상태를 다시 조회하세요.'}finally{if(epoch===state.epoch){state.busy=false;render()}}}
el('form').addEventListener('submit',e=>{e.preventDefault();load()});for(const action of ['review','approve','prepare','cutover','effectReview','resume'])el(action).addEventListener('click',()=>act(action));for(const id of ['consent','recoveryConsent'])el(id).addEventListener('change',render);window.addEventListener('pagehide',()=>{state.epoch++;clearTimeout(state.timer)});
const initial=new URLSearchParams(window.location.search).get('job');if(initial&&jobPattern.test(initial)){el('job').value=initial;load()}
</script></body></html>
